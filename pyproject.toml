[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learnable-input-uwir"
version = "0.1.0"
description = "Reproducible studies of spatial/global latent conditioning for underwater image restoration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["torch==2.11.0", "torchvision==0.26.0", "numpy==2.4.6", "Pillow==12.3.0",
                "scipy==1.17.1", "scikit-image==0.25.2", "kornia==0.7.3"]

[project.scripts]
liuwir = "liuwir.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
